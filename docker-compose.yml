name: crimpy

networks:
  proxy:
    external: true
  crimpy_net:
    name: crimpy_net

services:
  db:
    container_name: crimpy_postgres
    image: postgres:16-alpine
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - crimpy_net
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${DB_NAME}", "-U", "${DB_USER}" ]
      interval: 5s
      retries: 5
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: crimpy_pgadmin4
    restart: always
    expose:
      - 80
    networks:
      - crimpy_net
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.crimpypg.rule=Host(`pg.crimpy.app`)
      - traefik.http.routers.crimpypg.entrypoints=websecure
      - traefik.http.routers.crimpypg.tls.certresolver=dnsResolver
      - traefik.http.routers.crimpypg.middlewares=vpn-only@file
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_MAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PWD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  migrate:
    container_name: crimpy_migrate
    image: krakoer/crimpy-migrate:${VERSION:-latest}
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - crimpy_net
    depends_on:
      db:
        condition: service_healthy

  api:
    container_name: crimpy_api
    image: krakoer/crimpy-api:${VERSION:-latest}
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-3000}
      ENV: production
      LOG_FILE: /logs/app.log
    expose:
      - ${PORT:-3000}
    volumes:
      - ./logs:/logs
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:${PORT:-3000}/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.routers.crimpy-api.rule=Host(`api.crimpy.app`)
      - traefik.http.routers.crimpy-api.entrypoints=websecure
      - traefik.http.routers.crimpy-api.tls.certresolver=dnsResolver
    networks:
      - crimpy_net
      - proxy
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always

volumes:
  pgdata:
    driver: local
  pgadmin-data:
