name: crimpy-prod

networks:
  proxy:
    external: true
  admin_net:
    external: true
  crimpy_prod_net:
    name: crimpy_prod_net

services:
  db:
    container_name: crimpy_prod_postgres
    image: postgres:16-alpine
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file: [.env.prod]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - crimpy_prod_net
    volumes:
      - prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_NAME}", "-U", "${DB_USER}"]
      interval: 5s
      retries: 5
    # No ports mapping: Postgres is reachable only from crimpy_prod_net.

  migrate:
    container_name: crimpy_prod_migrate
    image: krakoer/crimpy-migrate:${API_VERSION:-latest}
    restart: "no"
    env_file: [.env.prod]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - crimpy_prod_net
    depends_on:
      db:
        condition: service_healthy

  api:
    container_name: crimpy_prod_api
    image: krakoer/crimpy-api:${API_VERSION:-latest}
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file: [.env.prod]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-3000}
      ENV: production
      LOG_FILE: /logs/app.log
    expose:
      - ${PORT:-3000}
    volumes:
      - ./logs:/logs
    networks:
      - crimpy_prod_net
      - proxy
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3000}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.crimpy-api.rule=Host(`api.crimpy.app`)
      - traefik.http.routers.crimpy-api.entrypoints=websecure
      - traefik.http.routers.crimpy-api.tls.certresolver=dnsResolver
      - traefik.http.services.crimpy-api.loadbalancer.server.port=${PORT:-3000}
      # Health gated so Traefik only routes to a container that can serve.
      - traefik.http.services.crimpy-api.loadbalancer.healthcheck.path=/health
      - traefik.http.services.crimpy-api.loadbalancer.healthcheck.interval=10s

  frontend:
    container_name: crimpy_prod_frontend
    image: krakoer/crimpy-frontend:${FRONTEND_VERSION:-latest}
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # Read at runtime through /config.json, so this is the same image as preprod.
      PUBLIC_API_URL: https://api.crimpy.app
    expose:
      - 3000
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.crimpy-frontend.rule=Host(`crimpy.app`)
      - traefik.http.routers.crimpy-frontend.entrypoints=websecure
      - traefik.http.routers.crimpy-frontend.tls.certresolver=dnsResolver
      - traefik.http.services.crimpy-frontend.loadbalancer.server.port=3000

  pgadmin:
    container_name: crimpy_prod_pgadmin
    image: dpage/pgadmin4
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file: [.env.prod]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_MAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PWD}
    expose:
      - 80
    networks:
      - crimpy_prod_net
      - proxy
      - admin_net
    volumes:
      - prod-pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.crimpy-pg.rule=Host(`pg.crimpy.app`)
      - traefik.http.routers.crimpy-pg.entrypoints=websecure
      - traefik.http.routers.crimpy-pg.tls.certresolver=dnsResolver
      - traefik.http.routers.crimpy-pg.middlewares=vpn-only@file
      - traefik.http.services.crimpy-pg.loadbalancer.server.port=80

volumes:
  prod-pgdata:
  prod-pgadmin-data:
