host: api.crimpy.app
info:
  contact:
    email: support@crimpy.com
    name: API Support
  description: Backend API for Crimpy climbing training application
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://api.crimpy.app/terms
  title: Crimpy API
  version: "1.0"
paths:
  /api/admin/coaches/{id}/reject:
    put:
      consumes:
      - application/json
      description: Reject a pending coach account, revert it to a normal user and
        notify the coach by email (admin only)
      parameters:
      - description: Coach user ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Coach rejected successfully, with email_sent reporting whether
            the notification was delivered
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid user ID or user is not a coach
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Coach not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reject a coach account
      tags:
      - Admin
  /api/admin/coaches/{id}/validate:
    put:
      consumes:
      - application/json
      description: Approve a pending coach account and notify the coach by email (admin
        only)
      parameters:
      - description: Coach user ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Coach validated successfully, with email_sent reporting whether
            the notification was delivered
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid user ID, user is not a coach, coach already validated
            or email not verified
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Coach not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Validate a coach account
      tags:
      - Admin
  /api/admin/coaches/pending:
    get:
      consumes:
      - application/json
      description: Retrieve all coach accounts awaiting admin validation
      produces:
      - application/json
      responses:
        "200":
          description: List of pending coaches
          schema:
            items:
              $ref: '#/definitions/handler.CoachResponse'
            type: array
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get pending coach accounts
      tags:
      - Admin
  /api/admin/users:
    get:
      consumes:
      - application/json
      description: Retrieve all users in the system (admin only)
      produces:
      - application/json
      responses:
        "200":
          description: List of all users
          schema:
            items:
              $ref: '#/definitions/handler.UserResponse'
            type: array
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - Admin
  /api/admin/users/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a user from the system (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid user ID or cannot delete admin
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a user
      tags:
      - Admin
  /api/assessments:
    get:
      description: Retrieve all assessment results for the authenticated user, ordered
        by session date descending
      produces:
      - application/json
      responses:
        "200":
          description: List of assessments
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get all assessments for the current user
      tags:
      - Assessment
    post:
      consumes:
      - application/json
      description: Create a new assessment result for the authenticated user, linked
        to an existing session they own
      parameters:
      - description: Assessment details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateAssessmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Assessment created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Session not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an assessment linked to an existing session
      tags:
      - Assessment
  /api/assessments/{id}:
    delete:
      description: Delete an assessment. User must own the associated session.
      parameters:
      - description: Assessment ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an assessment
      tags:
      - Assessment
  /api/auth/change-password:
    put:
      consumes:
      - application/json
      description: Change password for authenticated user or admin changing another
        user's password
      parameters:
      - description: Password change details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid old password
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Only admins can change other users' passwords
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change user password
      tags:
      - Authentication
  /api/builtin-training-weights:
    get:
      consumes:
      - application/json
      description: Retrieve all custom weight overrides for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: List of weight overrides
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
