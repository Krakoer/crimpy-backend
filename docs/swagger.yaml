basePath: /
definitions:
  handler.AssessmentRequest:
    properties:
      grip_position:
        type: integer
      left_value:
        type: number
      right_value:
        type: number
      type:
        type: integer
    type: object
  handler.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
      user_id:
        type: string
    type: object
  handler.CoachResponse:
    properties:
      coach_validated:
        type: boolean
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      firstname:
        type: string
      id:
        type: string
      is_coach:
        type: boolean
      lastname:
        type: string
    type: object
  handler.CoachTrainingListItem:
    properties:
      coach_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  handler.CoachTrainingResponse:
    properties:
      coach_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/handler.TrainingItemResponse'
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  handler.CreateCoachTrainingRequest:
    properties:
      description:
        type: string
      items:
        items:
          $ref: '#/definitions/handler.TrainingItemRequest'
        type: array
      title:
        type: string
    type: object
  handler.CreateExerciseRequest:
    properties:
      comment:
        type: string
      description:
        type: string
      name:
        type: string
      video_link:
        type: string
    type: object
  handler.CreateRepeaterRequest:
    properties:
      grip_position:
        type: integer
      reps:
        type: integer
      resttime:
        type: integer
      set_rest:
        type: integer
      sets:
        type: integer
      split_hand:
        type: boolean
      target_weight_left:
        type: number
      target_weight_right:
        type: number
      worktime:
        type: integer
    type: object
  handler.CreateSessionRequest:
    properties:
      assessments:
        items:
          $ref: '#/definitions/handler.AssessmentRequest'
        type: array
      duration:
        type: integer
      is_assessment:
        type: boolean
      name:
        type: string
      notes:
        type: string
      rep_datas:
        items:
          $ref: '#/definitions/handler.RepDataRequest'
        type: array
      repeater_reps:
        type: integer
      repeater_rest_time:
        type: integer
      repeater_set_rest:
        type: integer
      repeater_sets:
        type: integer
      repeater_split_hand:
        type: boolean
      repeater_work_time:
        type: integer
      session_type:
        type: integer
    type: object
  handler.CreateTrainingRequest:
    properties:
      is_assessment:
        type: boolean
      is_favorite:
        type: boolean
      name:
        type: string
      rep_templates:
        items:
          $ref: '#/definitions/handler.RepTemplateRequest'
        type: array
      repeater_id:
        type: string
    type: object
  handler.EnrolledUserResponse:
    properties:
      enrolled_at:
        type: string
      enrollment_id:
        type: string
      user_email:
        type: string
      user_firstname:
        type: string
      user_id:
        type: string
      user_lastname:
        type: string
    type: object
  handler.EnrollmentTokenInfoResponse:
    properties:
      coach_email:
        type: string
      coach_firstname:
        type: string
      coach_id:
        type: string
      coach_lastname:
        type: string
      expires_at:
        type: string
    type: object
  handler.EnrollmentTokenResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  handler.ExerciseResponse:
    properties:
      coach_id:
        type: string
      comment:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
      video_link:
        type: string
    type: object
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.RegisterRequest:
    properties:
      email:
        type: string
      firstname:
        type: string
      is_coach:
        type: boolean
      lastname:
        type: string
      password:
        type: string
    type: object
  handler.RepDataRequest:
    properties:
      average_weight:
        type: number
      duration:
        type: integer
      grip_position:
        type: integer
      index:
        type: integer
      is_rest:
        type: boolean
      right_hand:
        type: boolean
      target_weight:
        type: number
    type: object
  handler.RepTemplateRequest:
    properties:
      duration:
        type: integer
      grip_position:
        type: integer
      index:
        type: integer
      is_rest:
        type: boolean
      right_hand:
        type: boolean
      target_weight:
        type: number
    type: object
  handler.RepeaterResponse:
    properties:
      grip_position:
        type: integer
      id:
        type: integer
      reps:
        type: integer
      resttime:
        type: integer
      set_rest:
        type: integer
      sets:
        type: integer
      split_hand:
        type: boolean
      target_weight_left:
        type: number
      target_weight_right:
        type: number
      worktime:
        type: integer
    type: object
  handler.ResendVerificationRequest:
    properties:
      email:
        type: string
    type: object
  handler.SessionResponse:
    properties:
      date:
        type: string
      duration:
        type: integer
      id:
        type: integer
      is_assessment:
        type: boolean
      name:
        type: string
      notes:
        type: string
      repeater_reps:
        type: integer
      repeater_rest_time:
        type: integer
      repeater_set_rest:
        type: integer
      repeater_sets:
        type: integer
      repeater_split_hand:
        type: boolean
      repeater_work_time:
        type: integer
      session_type:
        type: integer
      user_id:
        type: string
    type: object
  handler.TrainingItemRequest:
    properties:
      both_hands:
        type: boolean
      cycle_rest_seconds:
        type: integer
      cycles:
        type: integer
      duration:
        type: integer
      edge_sizes_mm:
        items:
          type: integer
        type: array
      exercise_id:
        type: string
      hand_positions:
        items:
          type: object
        type: array
      hb_worktime_seconds:
        type: integer
      items:
        items:
          $ref: '#/definitions/handler.TrainingItemRequest'
        type: array
      left_loads:
        items:
          type: object
        type: array
      loads:
        items:
          type: object
        type: array
      reps:
        type: integer
      rest_seconds:
        type: integer
      section_title:
        type: string
      type:
        type: string
    type: object
  handler.TrainingItemResponse:
    properties:
      both_hands:
        type: boolean
      cycle_rest_seconds:
        type: integer
      cycles:
        type: integer
      duration:
        type: integer
      edge_sizes_mm:
        items:
          type: integer
        type: array
      exercise_id:
        type: string
      hand_positions:
        items:
          type: object
        type: array
      hb_worktime_seconds:
        type: integer
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/handler.TrainingItemResponse'
        type: array
      left_loads:
        items:
          type: object
        type: array
      loads:
        items:
          type: object
        type: array
      position:
        type: integer
      reps:
        type: integer
      rest_seconds:
        type: integer
      section_title:
        type: string
      type:
        type: string
    type: object
  handler.TrainingResponse:
    properties:
      id:
        type: integer
      is_assessment:
        type: boolean
      is_favorite:
        type: boolean
      name:
        type: string
      repeater_id:
        type: integer
      user_id:
        type: string
    type: object
  handler.UpdateCoachTrainingRequest:
    properties:
      description:
        type: string
      items:
        items:
          $ref: '#/definitions/handler.TrainingItemRequest'
        type: array
      title:
        type: string
    type: object
  handler.UpdateExerciseRequest:
    properties:
      comment:
        type: string
      description:
        type: string
      name:
        type: string
      video_link:
        type: string
    type: object
  handler.UpdateRepeaterRequest:
    properties:
      grip_position:
        type: integer
      reps:
        type: integer
      resttime:
        type: integer
      set_rest:
        type: integer
      sets:
        type: integer
      split_hand:
        type: boolean
      target_weight_left:
        type: number
      target_weight_right:
        type: number
      worktime:
        type: integer
    type: object
  handler.UpdateSessionRequest:
    properties:
      duration:
        type: integer
      name:
        type: string
      notes:
        type: string
    type: object
  handler.UpdateTrainingRequest:
    properties:
      is_favorite:
        type: boolean
      name:
        type: string
    type: object
  handler.UserEnrollmentResponse:
    properties:
      coach_email:
        type: string
      coach_firstname:
        type: string
      coach_id:
        type: string
      coach_lastname:
        type: string
      enrolled_at:
        type: string
      enrollment_id:
        type: string
    type: object
  handler.UserResponse:
    properties:
      coach_validated:
        type: boolean
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      firstname:
        type: string
      id:
        type: string
      is_admin:
        type: boolean
      is_coach:
        type: boolean
      lastname:
        type: string
    type: object
  handler.VerifyEmailRequest:
    properties:
      token:
        type: string
    type: object
  sync.PullResponse:
    properties:
      records:
        additionalProperties: true
        type: object
      server_version:
        type: integer
    type: object
  sync.PushRequest:
    properties:
      records:
        additionalProperties: true
        type: object
    type: object
  sync.PushResponse:
    properties:
      accepted:
        items:
          type: string
        type: array
      rejected:
        items:
          type: string
        type: array
      server_version:
        type: integer
    type: object
  sync.SyncSummaryResponse:
    properties:
      collections:
        additionalProperties:
          format: int64
          type: integer
        type: object
      last_sync_version:
        type: integer
      user_id:
        type: string
    type: object
host: api.portfolio-online.ovh
info:
  contact:
    email: support@crimpy.com
    name: API Support
  description: Backend API for Crimpy climbing training application
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://api.portfolio-online.ovh/terms
  title: Crimpy API
  version: "1.0"
paths:
  /api/admin/coaches/{id}/reject:
    put:
      consumes:
      - application/json
      description: Reject a pending coach account and revert to normal user (admin
        only)
      parameters:
      - description: Coach user ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Coach rejected successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid user ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reject a coach account
      tags:
      - Admin
  /api/admin/coaches/{id}/validate:
    put:
      consumes:
      - application/json
      description: Approve a pending coach account (admin only)
      parameters:
      - description: Coach user ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Coach validated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid user ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Validate a coach account
      tags:
      - Admin
  /api/admin/coaches/pending:
    get:
      consumes:
      - application/json
      description: Retrieve all coach accounts awaiting admin validation
      produces:
      - application/json
      responses:
        "200":
          description: List of pending coaches
          schema:
            items:
              $ref: '#/definitions/handler.CoachResponse'
            type: array
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get pending coach accounts
      tags:
      - Admin
  /api/admin/users:
    get:
      consumes:
      - application/json
      description: Retrieve all users in the system (admin only)
      produces:
      - application/json
      responses:
        "200":
          description: List of all users
          schema:
            items:
              $ref: '#/definitions/handler.UserResponse'
            type: array
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - Admin
  /api/admin/users/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a user from the system (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid user ID or cannot delete admin
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a user
      tags:
      - Admin
  /api/auth/change-password:
    put:
      consumes:
      - application/json
      description: Change password for authenticated user or admin changing another
        user's password
      parameters:
      - description: Password change details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid old password
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Only admins can change other users' passwords
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change user password
      tags:
      - Authentication
  /api/coach/clients/{user_id}/assessments:
    get:
      description: Retrieve all assessments for a user enrolled with the authenticated
        coach.
      parameters:
      - description: Client user ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of assessments
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "403":
          description: Not a coach or user not enrolled
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a client's assessments
      tags:
      - Coaching
  /api/coach/clients/{user_id}/sessions:
    get:
      description: Retrieve all sessions for a user enrolled with the authenticated
        coach.
      parameters:
      - description: Client user ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of sessions
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "403":
          description: Not a coach or user not enrolled
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a client's sessions
      tags:
      - Coaching
  /api/coach/clients/{user_id}/sessions/{session_id}:
    get:
      description: Retrieve a specific session with its rep data and assessments for
        a user enrolled with the authenticated coach.
      parameters:
      - description: Client user ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Session details with rep_datas and assessments
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid session ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Not a coach or user not enrolled
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Session not found or does not belong to client
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a client's session details
      tags:
      - Coaching
  /api/coach/enrollment-token:
    post:
      description: Generate a one-time enrollment link token (valid 7 days). Requires
        a validated coach account.
      produces:
      - application/json
      responses:
        "201":
          description: Token generated
          schema:
            $ref: '#/definitions/handler.EnrollmentTokenResponse'
        "403":
          description: Not a validated coach
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Generate an enrollment token
      tags:
      - Enrollment
  /api/coach/enrollments:
    get:
      description: Get all users enrolled under the authenticated coach.
      produces:
      - application/json
      responses:
        "200":
          description: List of enrolled users
          schema:
            items:
              $ref: '#/definitions/handler.EnrolledUserResponse'
            type: array
        "403":
          description: Not a coach
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List coach's enrolled clients
      tags:
      - Enrollment
  /api/coach/enrollments/{user_id}:
    delete:
      description: Remove a user from the coach's enrolled clients.
      parameters:
      - description: User ID to unenroll
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User unenrolled
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Not a coach
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not enrolled by this coach
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Coach removes a client
      tags:
      - Enrollment
  /api/coach/exercises:
    get:
      description: Get all exercises in the authenticated coach's library.
      produces:
      - application/json
      responses:
        "200":
          description: List of exercises
          schema:
            items:
              $ref: '#/definitions/handler.ExerciseResponse'
            type: array
        "403":
          description: Not a validated coach
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List coach's exercises
      tags:
      - Exercises
    post:
      consumes:
      - application/json
      description: Create a new exercise in the coach's exercise library. Requires
        a validated coach account.
      parameters:
      - description: Exercise data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateExerciseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Exercise created
          schema:
            $ref: '#/definitions/handler.ExerciseResponse'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Not a validated coach
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an exercise
      tags:
      - Exercises
  /api/coach/exercises/{id}:
    delete:
      description: Delete an exercise from the coach's library. Only the owning coach
        can delete.
      parameters:
      - description: Exercise ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Exercise deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid exercise ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Not a validated coach or not owner
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Exercise not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an exercise
      tags:
      - Exercises
    get:
      description: Get a specific exercise by ID. Only accessible by the owning coach.
      parameters:
      - description: Exercise ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Exercise details
          schema:
            $ref: '#/definitions/handler.ExerciseResponse'
        "400":
          description: Invalid exercise ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Not a validated coach or not owner
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Exercise not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get an exercise
      tags:
      - Exercises
    put:
      consumes:
      - application/json
      description: Update an exercise in the coach's library. Only the owning coach
        can update.
      parameters:
      - description: Exercise ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated exercise data
        in: body
        name: request
