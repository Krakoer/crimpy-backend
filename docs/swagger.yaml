        type: integer
      id:
        type: string
      is_everyday:
        type: boolean
      notes:
        type: string
      overrides:
        items:
          $ref: '#/definitions/handler.SessionOverrideResponse'
        type: array
      position:
        type: integer
      times_per_week:
        type: integer
      training_id:
        type: string
      training_title:
        type: string
      training_type:
