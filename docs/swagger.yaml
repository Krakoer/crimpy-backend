      repeater_set_rest:
        type: integer
      repeater_sets:
        type: integer
      repeater_split_hand:
        type: boolean
      repeater_work_time:
        type: integer
      training_id:
        type: string
    type: object
  handler.CreateTagRequest:
    properties:
      color:
        type: string
      name:
        type: string
    type: object
  handler.CreateTrainingRequest:
    properties:
      comment:
        type: string
      description:
        type: string
      goal:
        type: string
      is_favorite:
        type: boolean
      items:
        items:
          $ref: '#/definitions/handler.TrainingItemRequest'
        type: array
      title:
        type: string
      training_type:
        type: string
    type: object
  handler.EnrolledUserResponse:
    properties:
      enrolled_at:
        type: string
      enrollment_id:
        type: string
      user_email:
        type: string
      user_firstname:
        type: string
      user_id:
        type: string
      user_lastname:
        type: string
    type: object
  handler.EnrollmentTokenInfoResponse:
    properties:
      coach_email:
        type: string
      coach_firstname:
        type: string
      coach_id:
        type: string
      coach_lastname:
        type: string
      expires_at:
        type: string
    type: object
  handler.EnrollmentTokenResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
