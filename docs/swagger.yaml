        - right
        type: string
      hand_positions:
        items:
          type: object
        type: array
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/handler.TrainingItemResponse'
        type: array
      left_loads:
        items:
          type: object
        type: array
      load_is_max:
        type: boolean
      loads:
        items:
          type: object
        type: array
      position:
        type: integer
      reps:
        type: integer
      rest_seconds:
        type: integer
      type:
        type: string
      variable_targets:
        type: object
      worktime_seconds:
        type: integer
    type: object
  handler.TrainingListItem:
    properties:
      comment:
        type: string
      created_at:
        type: string
      description:
        type: string
      goal:
        type: string
      id:
        type: string
      is_favorite:
        type: boolean
      title:
        type: string
      training_type:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  handler.TrainingResponse:
    properties:
      comment:
        type: string
      created_at:
        type: string
      description:
        type: string
      goal:
        type: string
      id:
        type: string
      is_favorite:
        type: boolean
      items:
        items:
          $ref: '#/definitions/handler.TrainingItemResponse'
        type: array
      title:
        type: string
      training_type:
