      - application/json
      description: Replace the training metadata and items tree. Only the owner can
        update. An item sent back with the id it was read under keeps that id, so
        the rep data, results and program overrides pointing at it survive the edit;
        an item sent without one is added, and a stored item the payload no longer
        carries is deleted.
      parameters:
      - description: Training ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated training data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateTrainingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated training
          schema:
            $ref: '#/definitions/handler.TrainingResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Training not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a training template
      tags:
      - Trainings
  /api/user:
    get:
      consumes:
      - application/json
      description: Get the authenticated user's information from their JWT token
      produces:
      - application/json
      responses:
        "200":
          description: User information
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "401":
          description: Unauthorized - invalid or missing token
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user information
      tags:
      - Authentication
  /api/user/availability:
    get:
      description: Retrieve every calendar week the authenticated user has declared
        their availability for.
      produces:
      - application/json
      responses:
        "200":
          description: Declared weeks
          schema:
            items:
              $ref: '#/definitions/handler.WeekAvailabilityResponse'
            type: array
        "401":
          description: Invalid user ID
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get my declared availability
      tags:
      - Availability
  /api/user/availability-reminder:
    get:
      description: Retrieve the weekly reminder the authenticated user's coach set.
        The hour is a wall clock time the athlete app raises in the athlete's own
        timezone.
      produces:
      - application/json
      responses:
        "200":
          description: The reminder
          schema:
            $ref: '#/definitions/handler.AvailabilityReminderResponse'
        "401":
          description: Invalid user ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No coach, or no reminder configured
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get the availability reminder my coach configured
      tags:
      - Availability
  /api/user/availability/{week_start}:
    put:
      consumes:
      - application/json
      description: Replace the authenticated user's availability for one calendar
        week. The body must carry all seven days, day_of_week 0 = Monday to 6 = Sunday.
        A day declared unavailable keeps its note and drops its duration.
      parameters:
      - description: Monday of the week, YYYY-MM-DD
        in: path
        name: week_start
        required: true
        type: string
      - description: The seven days of the week
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.WeekAvailabilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The declared week
          schema:
            $ref: '#/definitions/handler.WeekAvailabilityResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Declare my availability for a calendar week
      tags:
      - Availability
  /api/user/enrollment:
    delete:
      description: Remove the authenticated user from their current coach enrollment.
      produces:
      - application/json
      responses:
        "200":
          description: Left coach successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not enrolled with any coach
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: User leaves their coach
      tags:
      - Enrollment
    get:
      description: Get the coach the authenticated user is currently enrolled with.
      produces:
      - application/json
      responses:
        "200":
          description: Current enrollment
          schema:
            $ref: '#/definitions/handler.UserEnrollmentResponse'
        "404":
          description: Not enrolled with any coach
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user's current coach enrollment
      tags:
      - Enrollment
  /api/user/programs:
    get:
      description: Get all programs assigned to the authenticated user by their coach.
      produces:
      - application/json
      responses:
        "200":
          description: List of programs
          schema:
            items:
              $ref: '#/definitions/handler.ProgramListItem'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List my training programs
      tags:
      - Programs
  /api/user/programs/{program_id}:
    get:
      description: Get a specific program assigned to the authenticated user.
      parameters:
      - description: Program ID
        in: path
        name: program_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Program
          schema:
            $ref: '#/definitions/handler.ProgramResponse'
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Program not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get one of my training programs
      tags:
      - Programs
  /api/user/programs/{program_id}/trainings/{training_id}:
    get:
      description: Get the full training tree for a training scheduled in a program
        assigned to the authenticated user. Authorized through program ownership rather
        than training ownership. referenced_assessments names the assessments the
        training items read against plus the ones only a week override of this program
        reads against, so a percentage prescribed on a single week can be labelled.
      parameters:
      - description: Program ID
        in: path
        name: program_id
        required: true
        type: string
      - description: Training ID
        in: path
        name: training_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Training
          schema:
            $ref: '#/definitions/handler.TrainingResponse'
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Training not found in program
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a training referenced by one of my programs
      tags:
      - Programs
  /api/user/programs/{program_id}/weeks:
    get:
      description: Get all defined weeks for a program assigned to the authenticated
        user.
      parameters:
      - description: Program ID
        in: path
        name: program_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of weeks
          schema:
            items:
              $ref: '#/definitions/handler.WeekListItem'
            type: array
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Program not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List weeks of one of my programs
      tags:
      - Programs
  /api/user/programs/{program_id}/weeks/{week_number}:
    get:
      description: Get a specific week with sessions and overrides for a program assigned
        to the authenticated user. An override the training item no longer takes,
        because the training was edited after the week was prescribed, is left out,
        so what the client merges is what the session run from it will freeze.
      parameters:
      - description: Program ID
        in: path
        name: program_id
        required: true
        type: string
      - description: Week number
        in: path
        name: week_number
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Week with sessions and overrides
          schema:
            $ref: '#/definitions/handler.WeekResponse'
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Program or week not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a week from one of my programs
      tags:
      - Programs
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful with token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - Authentication
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke a refresh token. Always succeeds so clients can clear local
        state.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged out
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Exchange a valid refresh token for a new access token. The refresh
        token is rotated: the old one is revoked and a new one is returned.'
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New access and refresh tokens
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired refresh token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email already registered
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Authentication
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Resend verification email with a 10-minute cooldown per email
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ResendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Verification email sent
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request or email already verified
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too many requests - cooldown active
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend verification email
      tags:
      - Authentication
  /auth/verify:
    post:
      consumes:
      - application/json
      description: Verify user email using the token sent via email
      parameters:
      - description: Validation Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email verified successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid or missing token
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Invalid or expired token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify user email
      tags:
      - Authentication
schemes:
- https
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
