  /api/coach/todo:
    get:
      description: 'What the authenticated coach still owes their coachees: the sessions
        whose notes have no answer yet, capped at 50 with pending_feedback_total carrying
        the real count, and the programs whose current or next calendar week holds
        no session, plus how many sessions their athletes did this week. Each empty
        week carries a scope, current for the week being trained now and next for
        the one starting on the coming Monday. The current ones are always listed;
        the next ones only once the weekly moment the coach configured has passed
        in their own week, which is why the caller sends its UTC offset.'
