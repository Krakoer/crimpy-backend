  /api/coach/clients/{user_id}/programs/{program_id}/weeks/{week_number}:
    delete:
      description: Delete a week and all its sessions/overrides (cascade). Refused
        when the week holds a session the athlete already played, because the cascade
        would null the link that session keeps to what was prescribed.
      parameters:
      - description: Client user ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Program ID
        in: path
        name: program_id
        required: true
        type: string
      - description: Week number
        in: path
        name: week_number
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Week deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Week holds a played session
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Program or week not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a program week
      tags:
      - Programs
    get:
      description: 'Get a specific week with its sessions and per-item overrides.
        Each override carries override_stale, computed against the training as it
        now stands: it marks an override the training item no longer takes, which
        the athlete is therefore handed the item without, and stale_reason carries
        the refusal the write path answers with for the same override. The stored
        row is never touched and never hidden, so the week can be sent back unchanged.'
      parameters:
      - description: Client user ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Program ID
        in: path
        name: program_id
        required: true
        type: string
      - description: Week number
        in: path
        name: week_number
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Week with sessions and overrides
          schema:
            $ref: '#/definitions/handler.WeekResponse'
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Program or week not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a program week
      tags:
      - Programs
    put:
      consumes:
      - application/json
      description: 'Upsert a week''s sessions and overrides. A session sent back with
        its id is updated in place and keeps that id, one sent without an id is created,
        and any session of the week missing from the payload is deleted. A session
        the athlete has already played (is_locked) is frozen: its training and overrides
        must be sent back unchanged and it may not be dropped from the week. The order
        of the sessions array is the order of the week: it sets the position stored
        on each session, and every read hands them back sorted by it. Position is
        response-only, sending one is ignored. Each override in this echo answers
        override_stale false: a save carrying a stale override is refused outright,
        so anything written here has just been validated against the training. Read
        the flag from GET, which computes it against the training as it now stands.'
      parameters:
      - description: Client user ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Program ID
        in: path
        name: program_id
        required: true
        type: string
      - description: Week number (>= 1)
        in: path
        name: week_number
        required: true
        type: integer
      - description: Week data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpsertWeekRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Upserted week
          schema:
            $ref: '#/definitions/handler.WeekResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Program not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create or replace a program week
      tags:
      - Programs
