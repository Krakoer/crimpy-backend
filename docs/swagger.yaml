    type: object
  handler.WeekListItem:
    properties:
      created_at:
        type: string
      id:
        type: string
      notes:
        type: string
      program_id:
        type: string
      updated_at:
        type: string
      week_number:
        type: integer
    type: object
  handler.WeekResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      notes:
        type: string
      program_id:
        type: string
      sessions:
        items:
          $ref: '#/definitions/handler.WeekSessionResponse'
        type: array
      updated_at:
