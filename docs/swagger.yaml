  /api/sessions:
    get:
      consumes:
      - application/json
      description: Retrieve all training sessions for the authenticated user, each
        with its rep count
      produces:
      - application/json
      responses:
        "200":
          description: List of sessions
          schema:
            items:
              $ref: '#/definitions/handler.SessionListItem'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get all sessions
      tags:
      - Session
    post:
      consumes:
      - application/json
      description: 'Create a new training session for the authenticated user with
        optional rep data and assessments. A session run from a prescription freezes
        it onto the session, with the program session overrides merged in, so later
        edits of the training cannot rewrite it. An override the training item no
        longer takes, because the training was edited after the week was prescribed,
        is dropped rather than merged, so what is frozen is never a shape the write
        paths refuse. When a program_session_id is sent, that row decides the training,
        and a training_id disagreeing with it is refused. A logged session may carry
        the link as well, so a coach slot with nothing to step through can be completed
        by hand; only a played one locks the coach''s week. A rep may name the prescription
        item it was played from through training_item_id, which must be one of the
        items the session was prescribed. A rep whose step prescribed a load the run
        failed to measure sends target_unmeasured, so a client can tell it from a
        rep no target was ever expected for. That flag is what the clients grade on:
        such a rep is recorded with no target, and one sent with both is stored as
        it arrives and still read as unmeasured. A run may also send item_results,
        the counts it resolved for items the prescription left open: the reps an AMRAP
        turned out to be, and the rounds an emom was carried through. Each names one
        of the prescribed items, an occurrence telling repeated passes apart, and
        the field it answers.'
      parameters:
      - description: Session details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateSessionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Session created successfully
          schema:
            $ref: '#/definitions/handler.SessionResponse'
        "400":
          description: Invalid request or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Training or program session not available to the user
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new session
      tags:
      - Session
