basePath: /
definitions:
  handler.AssessmentDefinitionResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_builtin:
        type: boolean
      label:
        type: string
      per_hand:
        type: boolean
      prompt:
        description: |-
          Prompt and TrainingID are set on a coach written assessment and absent on
          the ones Crimpy ships, which the app runs from a sensor protocol instead of
          a training ending on a question.
        type: string
      training_id:
        type: string
      unit:
        enum:
        - kilograms
        - seconds
        - repetitions
        type: string
      unit_locked:
        description: |-
          Set once the unit and the hands can no longer move: results were measured
          against them, or a training reads a number against them.
        type: boolean
      updated_at:
        type: string
    type: object
  handler.AssessmentDefinitionSnapshot:
    properties:
      id:
        type: string
      label:
        type: string
      per_hand:
        type: boolean
      prompt:
        type: string
      training_id:
        description: The training the assessment is run from, absent on the ones Crimpy
          ships.
        type: string
      unit:
        enum:
        - kilograms
        - seconds
        - repetitions
        type: string
      unit_locked:
        description: |-
          Set once the unit and the hands can no longer move, because results were
          measured against them or a training reads a number against them. An editor
          shows the two controls as fixed rather than letting a coach try and be
          refused.
        type: boolean
    type: object
  handler.AssessmentListItem:
    properties:
      assessment_id:
        type: string
      grip_position:
        type: integer
      id:
        type: string
      label:
        type: string
      left_value:
        type: number
      per_hand:
        type: boolean
      right_value:
        type: number
      session_date:
        type: string
      session_id:
        type: string
      training_id:
        description: The training the assessment is run from, absent for the ones
          Crimpy ships.
        type: string
      unit:
        enum:
        - kilograms
        - seconds
        - repetitions
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  handler.AssessmentRequest:
    properties:
      assessment_id:
        type: string
      grip_position:
        type: integer
      left_value:
        type: number
      right_value:
        type: number
    type: object
  handler.AssessmentResponse:
    properties:
      assessment_id:
        type: string
      grip_position:
        type: integer
      id:
        type: string
      label:
        type: string
      left_value:
        type: number
      per_hand:
        type: boolean
      right_value:
        type: number
      session_id:
        type: string
      training_id:
        description: The training the assessment is run from, absent for the ones
          Crimpy ships.
        type: string
      unit:
        enum:
        - kilograms
        - seconds
        - repetitions
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  handler.AvailabilityReminderRequest:
    properties:
      day_of_week:
        type: integer
      enabled:
        type: boolean
      hour:
        type: integer
      minute:
        type: integer
    type: object
  handler.AvailabilityReminderResponse:
    properties:
      day_of_week:
        type: integer
      enabled:
        type: boolean
      hour:
        type: integer
      minute:
        type: integer
    type: object
  handler.BuiltinTrainingWeightResponse:
    properties:
      builtin_training_id:
        type: string
      custom_weight_left:
        type: number
      custom_weight_right:
        type: number
      id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  handler.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
      user_id:
        type: string
    type: object
  handler.CoachResponse:
    properties:
      coach_validated:
        type: boolean
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      firstname:
        type: string
      id:
        type: string
      is_coach:
        type: boolean
      lastname:
        type: string
    type: object
  handler.CoachTodoResponse:
    properties:
      empty_week_check:
        $ref: '#/definitions/handler.EmptyWeekCheckResponse'
      empty_weeks:
        items:
          $ref: '#/definitions/handler.EmptyProgramWeekResponse'
        type: array
      pending_feedback:
        items:
          $ref: '#/definitions/handler.PendingFeedbackResponse'
        type: array
      pending_feedback_total:
        description: |-
          How many sessions are waiting on an answer in all, which is more than
          PendingFeedback holds once the cap is reached.
        type: integer
      sessions_this_week:
        description: |-
          How many sessions the coach's athletes did in the current week. Carried
          here rather than on its own route because the week it counts is the local
          one this request already had to place to judge the empty week check.
        type: integer
    type: object
  handler.CoachTodoSettingsRequest:
    properties:
      empty_week_day_of_week:
        type: integer
      empty_week_hour:
        type: integer
      empty_week_minute:
        type: integer
    type: object
  handler.CoachTodoSettingsResponse:
    properties:
      empty_week_day_of_week:
        type: integer
      empty_week_hour:
        type: integer
      empty_week_minute:
        type: integer
    type: object
  handler.CreateAssessmentDefinitionRequest:
    properties:
      label:
        type: string
      per_hand:
        type: boolean
      prompt:
        type: string
      training_id:
        type: string
      unit:
        enum:
        - kilograms
        - seconds
        - repetitions
        type: string
    type: object
  handler.CreateAssessmentRequest:
    properties:
      assessment_id:
        type: string
      grip_position:
        type: integer
      left_value:
        type: number
      right_value:
        type: number
      session_id:
        type: string
    type: object
  handler.CreateBuiltinTrainingWeightRequest:
    properties:
      builtin_training_id:
        type: string
      custom_weight_left:
        type: number
      custom_weight_right:
        type: number
      id:
        type: string
    type: object
  handler.CreateExerciseRequest:
    properties:
      comment:
        type: string
      description:
        type: string
      name:
        type: string
      video_link:
        type: string
    type: object
  handler.CreateProgramRequest:
    properties:
      duration_weeks:
        type: integer
      name:
        type: string
      objective:
        type: string
      start_date:
        type: string
    type: object
  handler.CreateSensorConfigRequest:
    properties:
      coef:
        type: number
      id:
        type: string
      index:
        type: integer
      name:
        type: string
      tare:
        type: number
    type: object
  handler.CreateSessionRequest:
    properties:
      activity:
        type: integer
      assessments:
        items:
          $ref: '#/definitions/handler.AssessmentRequest'
        type: array
      date:
        type: string
      duration:
        type: integer
      is_assessment:
        type: boolean
      item_results:
        description: |-
          ItemResults are the counts the run resolved for items the prescription
          left open: an AMRAP the athlete measured by doing it, and the rounds an
          emom was carried through.
        items:
          $ref: '#/definitions/handler.SessionItemResultRequest'
        type: array
      name:
        type: string
      notes:
        type: string
      origin:
        type: string
      program_session_id:
        type: string
      rep_datas:
        items:
          $ref: '#/definitions/handler.RepDataRequest'
        type: array
      samples:
        allOf:
        - $ref: '#/definitions/handler.SessionSamplesRequest'
        description: |-
          Samples is the force curve the sensor recorded. Accepted on an assessment
          only: it is what a critical force or an MVC result means, and on any other
          session it would be bulk nothing reads.
      training_id:
        type: string
    type: object
  handler.CreateTagRequest:
    properties:
      color:
        type: string
      name:
        type: string
    type: object
  handler.CreateTrainingRequest:
    properties:
      comment:
        type: string
      description:
        type: string
      goal:
        type: string
      is_favorite:
        type: boolean
      items:
        items:
          $ref: '#/definitions/handler.TrainingItemRequest'
        type: array
      title:
        type: string
      training_type:
        type: string
    type: object
  handler.DayAvailabilityRequest:
    properties:
      day_of_week:
        type: integer
      duration_minutes:
        type: integer
      is_available:
        type: boolean
      note:
        type: string
    type: object
  handler.DayAvailabilityResponse:
    properties:
      day_of_week:
        type: integer
      duration_minutes:
        type: integer
      is_available:
        type: boolean
      note:
        type: string
    type: object
  handler.EmptyProgramWeekResponse:
    properties:
      program_id:
        type: string
      program_name:
        type: string
      scope:
        description: |-
          Scope is "current" for the week being trained right now and "next" for
          the one starting on the coming Monday.
        type: string
      user_firstname:
        type: string
      user_id:
        type: string
      user_lastname:
        type: string
      week_number:
        type: integer
      week_start:
        type: string
    type: object
  handler.EmptyWeekCheckResponse:
    properties:
      day_of_week:
        type: integer
      hour:
        type: integer
      minute:
        type: integer
      reached:
        type: boolean
      week_start:
        type: string
    type: object
  handler.EnrolledUserResponse:
    properties:
      enrolled_at:
        type: string
      enrollment_id:
        type: string
      user_email:
        type: string
      user_firstname:
        type: string
      user_id:
        type: string
      user_lastname:
        type: string
    type: object
  handler.EnrollmentTokenInfoResponse:
    properties:
      coach_email:
        type: string
      coach_firstname:
        type: string
      coach_id:
        type: string
      coach_lastname:
        type: string
      expires_at:
        type: string
    type: object
  handler.EnrollmentTokenResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  handler.ExerciseListResponse:
    properties:
      exercises:
        items:
          $ref: '#/definitions/handler.ExerciseResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  handler.ExerciseResponse:
    properties:
      coach_id:
        type: string
      comment:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_favorite:
        type: boolean
      name:
        type: string
      tags:
        items:
          $ref: '#/definitions/handler.TagResponse'
        type: array
      updated_at:
        type: string
      video_link:
        type: string
    type: object
  handler.FeedEventResponse:
    properties:
      activity:
        type: integer
      kind:
        type: string
      note:
        type: string
      occurred_at:
        type: string
      origin:
        type: string
      session_id:
        type: string
      title:
        type: string
      user_firstname:
        type: string
      user_id:
        type: string
      user_lastname:
        type: string
      week_start:
        type: string
    type: object
  handler.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handler.PendingFeedbackResponse:
    properties:
      activity:
        type: integer
      notes:
        type: string
      session_date:
        type: string
      session_id:
        type: string
      session_name:
        type: string
      user_firstname:
        type: string
      user_id:
        type: string
      user_lastname:
        type: string
    type: object
  handler.PinBuiltinTrainingRequest:
    properties:
      builtin_training_id:
        type: string
    type: object
  handler.ProgramListItem:
    properties:
      coach_id:
        type: string
      created_at:
        type: string
      duration_weeks:
        type: integer
      id:
        type: string
      name:
        type: string
      objective:
        type: string
      start_date:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  handler.ProgramResponse:
    properties:
      coach_id:
        type: string
      created_at:
        type: string
      duration_weeks:
        type: integer
      id:
        type: string
      name:
        type: string
      objective:
        type: string
      start_date:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handler.RegisterRequest:
    properties:
      email:
        type: string
      firstname:
        type: string
      is_coach:
        type: boolean
      lastname:
        type: string
      password:
        type: string
    type: object
  handler.RepDataRequest:
    properties:
      average_weight:
        type: number
      duration:
        type: integer
      edge_size_mm:
        type: integer
      grip_position:
        type: integer
      hand:
        description: |-
          Hand is which hand pulled the rep: "left", "right" or "both". A two handed
          hang is a state of its own, not one of the single hands.
        type: string
      index:
        type: integer
      is_rest:
        type: boolean
      target_unmeasured:
        description: |-
          TargetUnmeasured says the step prescribed a load nothing measured, which
          is a sensor that dropped mid run. The rep then carries no target, the same
          as a step nothing was meant to measure, and this is what tells them apart.
        type: boolean
      target_weight:
        type: number
      training_item_id:
        description: |-
          TrainingItemID is the prescription item this rep was played from, absent
          for a rep recorded outside a training.
        type: string
    type: object
  handler.RepDataResponse:
    properties:
      average_weight:
        type: number
      duration:
        type: integer
      edge_size_mm:
        type: integer
      grip_position:
        type: integer
      hand:
        description: 'Hand is which hand pulled the rep: "left", "right" or "both".'
        type: string
      id:
        type: string
      index:
        type: integer
      is_rest:
        type: boolean
      session_id:
        type: string
      target_unmeasured:
        description: |-
          TargetUnmeasured marks a rep the run was supposed to grade and could not,
          because the sensor delivered nothing while the step was running. It has no
          target for that reason, so a client counting on-target reps leaves it out
          of the ratio rather than reading it as a miss.
        type: boolean
      target_weight:
        type: number
      training_item_id:
        description: |-
          TrainingItemID keys into the session prescription items, so the reps can
          be read block by block. Absent on a rep played outside a training, and on
          sessions recorded before the app sent it.
        type: string
      updated_at:
        type: string
    type: object
  handler.ResendVerificationRequest:
    properties:
      email:
        type: string
    type: object
  handler.SessionCoachReplyRequest:
    properties:
      reply:
        type: string
    type: object
  handler.SessionDetailResponse:
    properties:
      assessments:
        items:
          $ref: '#/definitions/handler.AssessmentResponse'
        type: array
      item_results:
        description: |-
          ItemResults are the counts the run recorded for the items the
          prescription left open, empty for a session that had none.
        items:
          $ref: '#/definitions/handler.SessionItemResultResponse'
        type: array
      rep_datas:
        items:
          $ref: '#/definitions/handler.RepDataResponse'
        type: array
      session:
        $ref: '#/definitions/handler.SessionResponse'
    type: object
  handler.SessionItemResultRequest:
    properties:
      field:
        enum:
        - reps
        - cycles
        type: string
      occurrence:
        type: integer
      training_item_id:
        type: string
      value:
        type: integer
    type: object
  handler.SessionItemResultResponse:
    properties:
      field:
        enum:
        - reps
        - cycles
        type: string
      id:
        type: string
      occurrence:
        type: integer
      session_id:
        type: string
      training_item_id:
        description: |-
          TrainingItemID keys into the session prescription items, the same way a
          rep does, so the count can be shown against what was asked for.
        type: string
      updated_at:
        type: string
      value:
        type: integer
    type: object
  handler.SessionListItem:
    properties:
      activity:
        type: integer
      coach_reply:
        description: |-
          CoachReply is what the coach answered the athlete's notes with, absent
          while they have not answered. CoachReplyAt dates that answer, and
          CoachReplyRead says whether the athlete has opened it since it was last
          written, which is what the app announces an unread answer from.
        type: string
      coach_reply_at:
        type: string
      coach_reply_read:
        type: boolean
      date:
        type: string
      duration:
        type: integer
      id:
        type: string
      is_assessment:
        type: boolean
      name:
        type: string
      notes:
        type: string
      origin:
        type: string
      prescription:
        description: |-
          Prescription is what the athlete was asked to do, frozen when the session
          was created. Absent on a session run from nothing. The list endpoints
          leave it out, since it is a whole training per row and only the detail
          screen reads it.
        type: object
      program_session_id:
        type: string
      rep_count:
        type: integer
      samples:
        description: |-
          Samples is the force curve the sensor recorded, carried on an assessment
          session only. Absent everywhere else, and left out by the list endpoints
          for the reason the prescription is.
        type: object
      training_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  handler.SessionOverrideRequest:
    properties:
      item_id:
        type: string
      overrides:
        type: object
    type: object
  handler.SessionOverrideResponse:
    properties:
      id:
        type: string
      item_id:
        type: string
      override_stale:
        description: |-
          OverrideStale marks an override the training item it targets no longer
          takes, so the athlete is handed the item without it. Only the coach reads
          compute it: the athlete reads leave such an override out entirely.
        type: boolean
      overrides:
        type: object
      stale_reason:
        description: |-
          StaleReason is the refusal the write path answers with when the same
          override is sent again, so the coach reads one wording whether they are
          told why a save was refused or why a saved override stopped applying.
        type: string
    type: object
  handler.SessionResponse:
    properties:
      activity:
        type: integer
      coach_reply:
        description: |-
          CoachReply is what the coach answered the athlete's notes with, absent
          while they have not answered. CoachReplyAt dates that answer, and
          CoachReplyRead says whether the athlete has opened it since it was last
          written, which is what the app announces an unread answer from.
        type: string
      coach_reply_at:
        type: string
      coach_reply_read:
        type: boolean
      date:
        type: string
      duration:
        type: integer
      id:
        type: string
      is_assessment:
        type: boolean
      name:
        type: string
      notes:
        type: string
      origin:
        type: string
      prescription:
        description: |-
          Prescription is what the athlete was asked to do, frozen when the session
          was created. Absent on a session run from nothing. The list endpoints
          leave it out, since it is a whole training per row and only the detail
          screen reads it.
        type: object
      program_session_id:
        type: string
      samples:
        description: |-
          Samples is the force curve the sensor recorded, carried on an assessment
          session only. Absent everywhere else, and left out by the list endpoints
          for the reason the prescription is.
        type: object
      training_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  handler.SessionSamplesRequest:
    properties:
      kg:
        items:
          type: number
        type: array
      ms:
        items:
          type: integer
        type: array
      t0:
        type: string
    type: object
  handler.SetExerciseFavoriteRequest:
    properties:
      is_favorite:
        type: boolean
    type: object
  handler.TagResponse:
    properties:
      color:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_builtin:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  handler.TrainingInUseResponse:
    properties:
      error:
        type: string
      programs:
        items:
          $ref: '#/definitions/handler.TrainingProgramUsage'
        type: array
    type: object
  handler.TrainingItemRequest:
    properties:
      comment:
        type: string
      cycle_rest_seconds:
        type: integer
      cycles:
        type: integer
      duration:
        type: integer
      edge_sizes_mm:
        items:
          type: integer
        type: array
      exercise_id:
        type: string
      free_text:
        type: string
      granularity:
        enum:
        - uniform
        - rep
        - set
        type: string
      group_title:
        type: string
      hand:
        enum:
        - both
        - alternate
        - split
        - left
        - right
        type: string
      hand_positions:
        items:
          type: object
        type: array
      id:
        description: |-
          The id the item was last read under, sent back on an update so the row
          keeps it. Empty for an item the coach just added, and ignored on create.
        type: string
      interval_seconds:
        type: integer
      items:
        items:
          $ref: '#/definitions/handler.TrainingItemRequest'
        type: array
      left_loads:
        items:
          type: object
        type: array
      load_is_max:
        type: boolean
      loads:
        items:
          type: object
        type: array
      reps:
        type: integer
      reps_is_max:
        type: boolean
      rest_seconds:
        type: integer
      type:
        type: string
      variable_targets:
        type: object
      worktime_seconds:
        type: integer
    type: object
  handler.TrainingItemResponse:
    properties:
      comment:
        type: string
      cycle_rest_seconds:
        type: integer
      cycles:
        type: integer
      duration:
        type: integer
      edge_sizes_mm:
        items:
          type: integer
        type: array
      exercise_id:
        type: string
      exercise_name:
        type: string
      free_text:
        type: string
      granularity:
        enum:
        - uniform
        - rep
        - set
        type: string
      group_title:
        type: string
      hand:
        enum:
        - both
        - alternate
        - split
        - left
        - right
        type: string
      hand_positions:
        items:
          type: object
        type: array
      id:
        type: string
      interval_seconds:
        type: integer
      items:
        items:
          $ref: '#/definitions/handler.TrainingItemResponse'
        type: array
      left_loads:
        items:
          type: object
        type: array
      load_is_max:
        type: boolean
      loads:
        items:
          type: object
        type: array
      position:
        type: integer
      reps:
        type: integer
      reps_is_max:
        type: boolean
      rest_seconds:
        type: integer
      type:
        type: string
      variable_targets:
        type: object
      worktime_seconds:
        type: integer
    type: object
  handler.TrainingListItem:
    properties:
      assessment:
        allOf:
        - $ref: '#/definitions/handler.AssessmentDefinitionSnapshot'
        description: |-
          Set when the training is a custom assessment, so a list can mark it and a
          picker can offer it as something to measure rather than to train.
      comment:
        type: string
      created_at:
        type: string
      description:
        type: string
      goal:
        type: string
      id:
        type: string
      is_favorite:
        type: boolean
      title:
        type: string
      training_type:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  handler.TrainingProgramUsage:
    properties:
      id:
        type: string
      name:
        type: string
      session_count:
        type: integer
    type: object
  handler.TrainingResponse:
    properties:
      assessment:
        allOf:
        - $ref: '#/definitions/handler.AssessmentDefinitionSnapshot'
        description: |-
          Set when the training is a custom assessment: it ends on the question the
          prompt asks, and the answer is recorded against this assessment.
      comment:
        type: string
      created_at:
        type: string
      description:
        type: string
      goal:
        type: string
      id:
        type: string
      is_favorite:
        type: boolean
      items:
        items:
          $ref: '#/definitions/handler.TrainingItemResponse'
        type: array
      referenced_assessments:
        description: |-
          The assessments the items reference, so a client can name and unit check a
          percentage without reading a definition it may not own, which is the case
          for an athlete running a training their coach wrote.
        items:
          $ref: '#/definitions/handler.AssessmentDefinitionSnapshot'
        type: array
      title:
        type: string
      training_type:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  handler.UpdateAssessmentDefinitionRequest:
    properties:
      label:
        type: string
      per_hand:
        type: boolean
      prompt:
        type: string
      unit:
        enum:
        - kilograms
        - seconds
        - repetitions
        type: string
    type: object
  handler.UpdateBuiltinTrainingWeightRequest:
    properties:
      custom_weight_left:
        type: number
      custom_weight_right:
        type: number
    type: object
  handler.UpdateExerciseRequest:
    properties:
      comment:
        type: string
      description:
        type: string
      name:
        type: string
      video_link:
        type: string
    type: object
  handler.UpdateProgramRequest:
    properties:
      duration_weeks:
        type: integer
      name:
        type: string
      objective:
        type: string
      start_date:
        type: string
    type: object
  handler.UpdateSensorConfigRequest:
    properties:
      coef:
        type: number
      index:
        type: integer
      name:
        type: string
      tare:
        type: number
    type: object
  handler.UpdateSessionRequest:
    properties:
      date:
        description: |-
          Only logged sessions send a date. Omitted, the stored one is kept, which is
          what played sessions rely on since their date is fixed by the run.
        type: string
      duration:
        type: integer
      name:
        type: string
      notes:
        type: string
    type: object
  handler.UpdateTagRequest:
    properties:
      color:
        type: string
      name:
        type: string
    type: object
  handler.UpdateTrainingRequest:
    properties:
      comment:
        type: string
      description:
        type: string
      goal:
        type: string
      is_favorite:
        type: boolean
      items:
        items:
          $ref: '#/definitions/handler.TrainingItemRequest'
        type: array
      title:
        type: string
      training_type:
        type: string
    type: object
  handler.UpsertWeekRequest:
    properties:
      notes:
        type: string
      sessions:
        items:
          $ref: '#/definitions/handler.WeekSessionRequest'
        type: array
    type: object
  handler.UserEnrollmentResponse:
    properties:
      coach_email:
        type: string
      coach_firstname:
        type: string
      coach_id:
        type: string
      coach_lastname:
        type: string
      enrolled_at:
        type: string
      enrollment_id:
        type: string
    type: object
  handler.UserResponse:
    properties:
      coach_validated:
        type: boolean
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      firstname:
        type: string
      id:
        type: string
      is_admin:
        type: boolean
      is_coach:
        type: boolean
      lastname:
        type: string
    type: object
  handler.VerifyEmailRequest:
    properties:
      token:
        type: string
    type: object
  handler.WeekAvailabilityRequest:
    properties:
      days:
        items:
          $ref: '#/definitions/handler.DayAvailabilityRequest'
        type: array
    type: object
  handler.WeekAvailabilityResponse:
    properties:
      days:
        items:
          $ref: '#/definitions/handler.DayAvailabilityResponse'
        type: array
      updated_at:
        type: string
      user_id:
        type: string
      week_start:
        type: string
    type: object
  handler.WeekListItem:
    properties:
      created_at:
        type: string
      id:
        type: string
      notes:
        type: string
      program_id:
        type: string
      updated_at:
        type: string
      week_number:
        type: integer
    type: object
  handler.WeekResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      notes:
        type: string
      program_id:
        type: string
      sessions:
        items:
          $ref: '#/definitions/handler.WeekSessionResponse'
        type: array
      updated_at:
        type: string
      week_number:
        type: integer
    type: object
  handler.WeekSessionRequest:
    properties:
      day_of_week:
        type: integer
      id:
        type: string
      is_everyday:
        type: boolean
      notes:
        type: string
      overrides:
        items:
          $ref: '#/definitions/handler.SessionOverrideRequest'
        type: array
      times_per_week:
        type: integer
      training_id:
        type: string
    type: object
  handler.WeekSessionResponse:
    properties:
      day_of_week:
        type: integer
      id:
        type: string
      is_everyday:
        type: boolean
      is_locked:
        type: boolean
      notes:
        type: string
      overrides:
        items:
          $ref: '#/definitions/handler.SessionOverrideResponse'
        type: array
      position:
        type: integer
      times_per_week:
        type: integer
      training_id:
        type: string
      training_title:
        type: string
      training_type:
        type: string
    type: object
host: api.crimpy.app
info:
  contact:
    email: support@crimpy.com
    name: API Support
  description: Backend API for Crimpy climbing training application
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://api.crimpy.app/terms
  title: Crimpy API
  version: "1.0"
paths:
  /api/admin/coaches/{id}/reject:
    put:
      consumes:
      - application/json
      description: Reject a pending coach account, revert it to a normal user and
        notify the coach by email (admin only)
      parameters:
      - description: Coach user ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Coach rejected successfully, with email_sent reporting whether
            the notification was delivered
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid user ID or user is not a coach
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Coach not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reject a coach account
      tags:
      - Admin
  /api/admin/coaches/{id}/validate:
    put:
      consumes:
      - application/json
      description: Approve a pending coach account and notify the coach by email (admin
        only)
      parameters:
      - description: Coach user ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Coach validated successfully, with email_sent reporting whether
            the notification was delivered
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid user ID, user is not a coach, coach already validated
            or email not verified
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Coach not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Validate a coach account
      tags:
      - Admin
  /api/admin/coaches/pending:
    get:
      consumes:
      - application/json
      description: Retrieve all coach accounts awaiting admin validation
      produces:
      - application/json
      responses:
        "200":
          description: List of pending coaches
          schema:
            items:
              $ref: '#/definitions/handler.CoachResponse'
            type: array
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get pending coach accounts
      tags:
      - Admin
  /api/admin/users:
    get:
      consumes:
      - application/json
      description: Retrieve all users in the system (admin only)
      produces:
      - application/json
      responses:
        "200":
          description: List of all users
          schema:
            items:
              $ref: '#/definitions/handler.UserResponse'
            type: array
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - Admin
  /api/admin/users/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a user from the system (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid user ID or cannot delete admin
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Admin access required
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a user
      tags:
      - Admin
  /api/assessment-definitions:
    get:
      description: The assessments Crimpy ships plus the caller's own, builtins first.
      produces:
      - application/json
      responses:
        "200":
          description: Assessments
          schema:
            items:
              $ref: '#/definitions/handler.AssessmentDefinitionResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List the assessments the caller may reference
      tags:
      - Assessments
    post:
      consumes:
      - application/json
      description: 'Turn one of the caller''s trainings into an assessment: it is
        run like any training and ends on the question the prompt asks.'
      parameters:
      - description: Assessment details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateAssessmentDefinitionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created assessment
          schema:
            $ref: '#/definitions/handler.AssessmentDefinitionResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Training is already an assessment
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a custom assessment
      tags:
      - Assessments
  /api/assessment-definitions/{id}:
    delete:
      description: Refused while results have been measured against it, so a history
        can never be silently erased.
      parameters:
      - description: Assessment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Assessment deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Assessment not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Assessment has results or is referenced
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a custom assessment
      tags:
      - Assessments
    put:
      consumes:
      - application/json
      description: Rename an assessment or reword its question. The unit and the per
        hand flag are frozen once results have been measured, since changing them
        would restate what those numbers mean.
      parameters:
      - description: Assessment ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated assessment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateAssessmentDefinitionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated assessment
          schema:
            $ref: '#/definitions/handler.AssessmentDefinitionResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Assessment not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Unit or hands frozen by results or references
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a custom assessment
      tags:
      - Assessments
  /api/assessments:
    get:
      description: Retrieve all assessment results for the authenticated user, ordered
        by session date descending
      produces:
      - application/json
      responses:
        "200":
          description: List of assessments
          schema:
            items:
              $ref: '#/definitions/handler.AssessmentListItem'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get all assessments for the current user
      tags:
      - Assessment
    post:
      consumes:
      - application/json
      description: Create a new assessment result for the authenticated user, linked
        to an existing session they own
      parameters:
      - description: Assessment details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateAssessmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Assessment created
          schema:
            $ref: '#/definitions/handler.AssessmentResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Session not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an assessment linked to an existing session
      tags:
      - Assessment
  /api/assessments/{id}:
    delete:
      description: Delete an assessment. User must own the associated session.
      parameters:
      - description: Assessment ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an assessment
      tags:
      - Assessment
  /api/auth/change-password:
    put:
      consumes:
      - application/json
      description: Change password for authenticated user or admin changing another
        user's password
      parameters:
      - description: Password change details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid old password
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Only admins can change other users' passwords
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change user password
      tags:
      - Authentication
  /api/builtin-training-weights:
    get:
      consumes:
      - application/json
      description: Retrieve all custom weight overrides for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: List of weight overrides
          schema:
            items:
              $ref: '#/definitions/handler.BuiltinTrainingWeightResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get all builtin training weight overrides
      tags:
      - BuiltinTrainingWeight
    post:
      consumes:
      - application/json
      description: Create a custom weight override for a builtin training. Saving
        a second time for the same builtin training updates the existing override
        rather than creating a duplicate.
      parameters:
      - description: Weight override details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateBuiltinTrainingWeightRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Weight override created
          schema:
            $ref: '#/definitions/handler.BuiltinTrainingWeightResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: A weight override with this id already exists
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a builtin training weight override
      tags:
      - BuiltinTrainingWeight
  /api/builtin-training-weights/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a custom weight override. User must own it.
      parameters:
      - description: Weight override ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deleted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a builtin training weight override
      tags:
      - BuiltinTrainingWeight
    put:
      consumes:
      - application/json
      description: Update custom weights. User must own it.
      parameters:
      - description: Weight override ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Updated weights
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateBuiltinTrainingWeightRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated weight override
          schema:
            $ref: '#/definitions/handler.BuiltinTrainingWeightResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a builtin training weight override
      tags:
      - BuiltinTrainingWeight
  /api/coach/availability-reminder:
    get:
      description: Retrieve the weekly reminder the authenticated coach configured
        for their coachees.
      produces:
      - application/json
      responses:
        "200":
          description: The reminder
          schema:
            $ref: '#/definitions/handler.AvailabilityReminderResponse'
        "403":
          description: Not a validated coach
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: No reminder configured
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get my availability reminder
      tags:
      - Availability
    put:
      consumes:
      - application/json
      description: Configure the weekly reminder nudging coachees who have not declared
        the coming week. day_of_week is 0 = Monday to 6 = Sunday. The hour is a wall
        clock time each athlete's app raises in that athlete's own timezone, not the
        coach's.
      parameters:
      - description: Reminder settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AvailabilityReminderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The saved reminder
          schema:
            $ref: '#/definitions/handler.AvailabilityReminderResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Not a validated coach
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Set my availability reminder
      tags:
      - Availability
  /api/coach/clients/{user_id}/assessments:
    get:
      description: Retrieve all assessments for a user enrolled with the authenticated
        coach.
      parameters:
      - description: Client user ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of assessments
          schema:
            items:
              $ref: '#/definitions/handler.AssessmentListItem'
            type: array
        "403":
          description: Not a coach or user not enrolled
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a client's assessments
      tags:
      - Coaching
  /api/coach/clients/{user_id}/availability:
    get:
      description: Retrieve every calendar week a user enrolled with the authenticated
