basePath: /
definitions:
  handler.AssessmentRequest:
    properties:
      grip_position:
        type: integer
      left_value:
        type: number
      right_value:
        type: number
      type:
        type: integer
    type: object
  handler.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
      user_id:
        type: string
    type: object
  handler.CoachResponse:
    properties:
      coach_validated:
        type: boolean
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      firstname:
        type: string
      id:
        type: string
      is_coach:
        type: boolean
      lastname:
        type: string
    type: object
  handler.CreateAssessmentRequest:
    properties:
      grip_position:
