name: crimpy-preprod

networks:
  proxy:
    external: true
  admin_net:
    external: true
  crimpy_preprod_net:
    name: crimpy_preprod_net

services:
  db:
    container_name: crimpy_preprod_postgres
    image: postgres:16-alpine
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - crimpy_preprod_net
    volumes:
      - preprod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_NAME}", "-U", "${DB_USER}"]
      interval: 5s
      retries: 5
    # No ports mapping: Postgres is reachable only from crimpy_preprod_net.

  migrate:
    container_name: crimpy_preprod_migrate
    image: krakoer/crimpy-migrate:${API_VERSION:-edge}
    restart: "no"
    env_file: [.env.preprod]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - crimpy_preprod_net
    depends_on:
      db:
        condition: service_healthy

  api:
    container_name: crimpy_preprod_api
    image: krakoer/crimpy-api:${API_VERSION:-edge}
    restart: always
    security_opt:
      - no-new-privileges:true
    env_file: [.env.preprod]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-3000}
      ENV: preproduction
    expose:
      - ${PORT:-3000}
    networks:
      - crimpy_preprod_net
      - proxy
      - admin_net
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3000}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.http.routers.dev-crimpy-api.rule=Host(`devapi.crimpy.app`)
      - traefik.http.routers.dev-crimpy-api.entrypoints=websecure
      - traefik.http.routers.dev-crimpy-api.tls.certresolver=dnsResolver
      # The whole preproduction stack is gated behind the VPN.
      - traefik.http.routers.dev-crimpy-api.middlewares=vpn-only@file
      - traefik.http.services.dev-crimpy-api.loadbalancer.server.port=${PORT:-3000}
      # Health gated, same as production, so the gating is exercised before it ships.
      - traefik.http.services.dev-crimpy-api.loadbalancer.healthcheck.path=/health
      - traefik.http.services.dev-crimpy-api.loadbalancer.healthcheck.interval=10s

  frontend:
    container_name: crimpy_preprod_frontend
    image: krakoer/crimpy-frontend:${FRONTEND_VERSION:-edge}
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # Read at runtime through /config.json, so this is the same image as prod.
      PUBLIC_API_URL: https://devapi.crimpy.app
    expose:
      - 3000
    networks:
      - proxy
      - admin_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.http.routers.dev-crimpy-frontend.rule=Host(`dev.crimpy.app`)
      - traefik.http.routers.dev-crimpy-frontend.entrypoints=websecure
      - traefik.http.routers.dev-crimpy-frontend.tls.certresolver=dnsResolver
      - traefik.http.routers.dev-crimpy-frontend.middlewares=vpn-only@file
      - traefik.http.services.dev-crimpy-frontend.loadbalancer.server.port=3000

  pgadmin:
    container_name: crimpy_preprod_pgadmin
    image: dpage/pgadmin4
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_MAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PWD}
    expose:
      - 80
    networks:
      - crimpy_preprod_net
      - proxy
      - admin_net
    volumes:
      - preprod-pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.dev-crimpy-pg.rule=Host(`devpg.crimpy.app`)
      - traefik.http.routers.dev-crimpy-pg.entrypoints=websecure
      - traefik.http.routers.dev-crimpy-pg.tls.certresolver=dnsResolver
      - traefik.http.routers.dev-crimpy-pg.middlewares=vpn-only@file
      - traefik.http.services.dev-crimpy-pg.loadbalancer.server.port=80

volumes:
  preprod-pgdata:
  preprod-pgadmin-data:
