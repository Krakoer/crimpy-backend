name: crimpy

services:
  db:
    container_name: crimpy_postgres
    image: postgres:16-alpine
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${DB_NAME}", "-U", "${DB_USER}" ]
      interval: 5s
      retries: 5
    restart: always

  migrate:
    container_name: crimpy_migrate
    image: arigaio/atlas:latest
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command:
      - migrate
      - apply
      - --url
      - ${DATABASE_URL}
      - --dir
      - file://migrations
    volumes:
      - ./migrations:/migrations
    depends_on:
      db:
        condition: service_healthy

  api:
    container_name: crimpy_api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-3000}
      ENV: production
    expose:
      - ${PORT:-3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always

volumes:
  pgdata:
    driver: local