info:
  name: Create Tag
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/coach/tags"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Strength",
        "color": "#E53935"
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setEnvVar("tagId", res.body.id);
        }
