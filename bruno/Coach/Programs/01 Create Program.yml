info:
  name: Create Program
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/coach/clients/{{clientUserId}}/programs"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "6-Week Finger Strength Block",
        "objective": "Build max finger strength on crimps",
        "start_date": "2026-06-01",
        "duration_weeks": 6,
        "slots": [
          {
            "training_id": "{{coachTrainingId}}",
            "day_of_week": 0
          },
          {
            "training_id": "{{coachTrainingId}}",
            "day_of_week": 2
          },
          {
            "training_id": "{{coachTrainingId}}",
            "times_per_week": 2
          }
        ]
      }
  auth:
    type: bearer
    token: "{{authTokenCoach}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setEnvVar("programId", res.body.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
