info:
  name: Update Training Template
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/coach/trainings/{{coachTrainingId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "Beginner Fingerboard Session (v2)",
        "description": "Updated with extra warm-up",
        "items": [
          {
            "type": "hangboard_rep",
            "position": 0,
            "cycles": 4,
            "cycle_rest_seconds": 120,
            "reps": 6,
            "hb_worktime_seconds": 7,
            "rest_seconds": 3,
            "both_hands": true,
            "loads": [
              {"value": 0, "unit": "kg"},
              {"value": 0, "unit": "kg"},
              {"value": 0, "unit": "kg"},
              {"value": 0, "unit": "kg"},
              {"value": 0, "unit": "kg"},
              {"value": 0, "unit": "kg"}
            ],
            "hand_positions": [["crimp"], ["crimp"], ["crimp"], ["crimp"], ["crimp"], ["crimp"]],
            "edge_sizes_mm": [20, 20, 20, 20, 20, 20],
            "items": []
          }
        ]
      }
  auth:
    type: bearer
    token: "{{authToken}}"
