info:
  name: Update Training
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/trainings/{{trainingId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "Max Hang 20mm (updated)",
        "description": "Heavy hangs on the 20mm edge, one kilo up",
        "training_type": "hangboard",
        "is_favorite": true,
        "items": [
          {
            "type": "repeater",
            "cycles": 2,
            "cycle_rest_seconds": 180,
            "reps": 3,
            "worktime_seconds": 7,
            "rest_seconds": 3,
            "hand": "both",
            "granularity": "rep",
            "loads": [
              {"value": 11, "unit": "kg"},
              {"value": 13, "unit": "kg"},
              {"value": 15, "unit": "kg"}
            ],
            "hand_positions": [["HC", "HC", "HC"]],
            "edge_sizes_mm": [20, 20, 20]
          }
        ]
      }
  auth: inherit
