info:
  name: Update Training
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/trainings/{{trainingId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Max Hang 20mm (updated)",
        "is_favorite": true,
        "rep_templates": [
          {
            "is_rest": false,
            "right_hand": true,
            "duration": 7000,
            "target_weight": 12.0,
            "index": 0,
            "grip_position": 0
          },
          {
            "is_rest": true,
            "right_hand": true,
            "duration": 3000,
            "target_weight": 0.0,
            "index": 1,
            "grip_position": 0
          }
        ]
      }
  auth:
    type: bearer
    token: "{{authTokenUser}}"
