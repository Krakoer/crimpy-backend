info:
  name: Update Training
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/trainings/{{trainingId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Max Hang 20mm (updated)",
        "is_favorite": true
      }
  auth:
    type: bearer
    token: "{{authToken}}"
