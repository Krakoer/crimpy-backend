info:
  name: Create Training
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/trainings"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "Max Hang 20mm",
        "description": "Heavy hangs on the 20mm edge",
        "training_type": "hangboard",
        "is_favorite": false,
        "items": [
          {
            "type": "repeater",
            "cycles": 2,
            "cycle_rest_seconds": 180,
            "reps": 3,
            "worktime_seconds": 7,
            "rest_seconds": 3,
            "hand": "both",
            "granularity": "rep",
            "loads": [
              {"value": 10, "unit": "kg"},
              {"value": 12, "unit": "kg"},
              {"value": 14, "unit": "kg"}
            ],
            "hand_positions": [["HC", "HC", "HC"]],
            "edge_sizes_mm": [20, 20, 20]
          },
          {
            "type": "hangboard_rep",
            "worktime_seconds": 10,
            "rest_seconds": 0,
            "hand": "both",
            "granularity": "uniform",
            "loads": [{"value": 100, "unit": "percent_bw"}],
            "hand_positions": [["HC"]],
            "edge_sizes_mm": [20]
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setEnvVar("trainingId", res.body.id);
        }
