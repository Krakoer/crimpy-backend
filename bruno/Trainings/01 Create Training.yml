info:
  name: Create Training
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/trainings"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Max Hang 20mm",
        "is_favorite": false,
        "is_assessment": false,
        "rep_templates": [
          {
            "is_rest": false,
            "right_hand": true,
            "duration": 7000,
            "target_weight": 10.0,
            "index": 0,
            "grip_position": 0
          },
          {
            "is_rest": true,
            "right_hand": true,
            "duration": 3000,
            "target_weight": 0.0,
            "index": 1,
            "grip_position": 0
          }
        ]
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setEnvVar("trainingId", res.body.ID);
        }
