info:
  name: Get Current User
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/user"
  body:
    type: none
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("userId", res.body.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
