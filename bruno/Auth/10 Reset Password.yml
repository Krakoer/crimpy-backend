info:
  name: Reset Password
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/auth/reset-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "token-from-the-reset-email",
        "new_password": "newpassword123"
      }
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    Answers 404 in a full run: the token only exists in the reset email, since
    the database keeps its hash. Paste the token from a real email to see the
    200. A reset signs out every session of the account.
  type: text/markdown
