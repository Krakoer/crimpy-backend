info:
  name: Forgot Password
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/auth/forgot-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{registeredEmail}}"
      }
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    Always answers 200 with the same message, whether or not the address has an
    account, so it cannot be used to find out which ones do. A second request
    for the same account within a minute sends no email. The link in the email
    is valid for one hour and points at the frontend reset-password page.
  type: text/markdown
