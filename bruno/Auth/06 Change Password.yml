info:
  name: Change Password
  type: http
  seq: 9

http:
  method: PUT
  url: "{{baseUrl}}/api/auth/change-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "old_password": "{{userPwd}}",
        "new_password": "{{userPwd}}"
      }
  auth: inherit

docs:
  content: |-
    Sets the password back to the one the environment already holds, so the
    request succeeds without locking the collection out of the account. The
    change revokes every refresh token of that user, so run Refresh Token
    before this one.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
