info:
  name: Change Password
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/api/auth/change-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "old_password": "secret123",
        "new_password": "newsecret456"
      }
  auth:
    type: bearer
    token: "{{authToken}}"
