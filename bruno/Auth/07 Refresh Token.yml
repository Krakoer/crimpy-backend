info:
  name: Refresh Token
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/auth/refresh"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refreshToken}}"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar("authTokenUser", res.body.token);
          bru.setEnvVar("refreshToken", res.body.refresh_token);
        }

docs:
  content: |-
    The refresh token is rotated: the one sent is revoked and the response
    carries its replacement, which is stored back into refreshToken.
  type: text/markdown
