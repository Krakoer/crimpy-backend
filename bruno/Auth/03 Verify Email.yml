info:
  name: Verify Email
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/auth/verify"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "{{verificationToken}}"
      }
  auth:
    type: none

docs:
  content: |-
    The token is mailed to the address that registered and is readable nowhere
    else, so this request answers 400 until verificationToken is filled in by
    hand from that email. Nothing else in the collection depends on it.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
