info:
  name: Verify Email
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/verify"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "the-verification-token-from-email"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
