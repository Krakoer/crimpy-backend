info:
  name: Resend Verification
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/resend-verification"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{registeredEmail}}"
      }
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    Always answers 200 with the same message, whether the address is unknown,
    already verified, inside its 10 minute cooldown, or was just sent a new link,
    so it cannot be used to find out which addresses have an account. In a full
    run Register has just sent a link, so this one sends nothing.
  type: text/markdown
