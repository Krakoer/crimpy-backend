info:
  name: Resend Verification
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/resend-verification"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{registeredEmail}}"
      }
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    Answers 429 in a full run. Registering already sent a verification email,
    and a resend is refused for 10 minutes after the last one, so the address
    Register just created is always inside its own cooldown. Point
    registeredEmail at an unverified address whose last email is older than that
    to see the 200.
  type: text/markdown
