info:
  name: Resend Verification
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/auth/resend-verification"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{registeredEmail}}"
      }
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |-
    Rate limited with the other /auth routes, 20 requests a minute per address,
    so a third full run inside the same minute answers 429 here rather than 200.
  type: text/markdown
