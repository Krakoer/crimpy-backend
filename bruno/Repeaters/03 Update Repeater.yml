info:
  name: Update Repeater
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/repeaters/{{repeaterId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "sets": 8,
        "reps": 6,
        "worktime": 7000,
        "resttime": 3000,
        "set_rest": 120000,
        "split_hand": false,
        "grip_position": 0,
        "target_weight_right": 12.5,
        "target_weight_left": 12.5
      }
  auth:
    type: bearer
    token: "{{authToken}}"
