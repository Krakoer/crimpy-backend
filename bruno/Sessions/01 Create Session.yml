info:
  name: Create Session
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/sessions"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Morning hang session",
        "notes": "Felt strong today",
        "date": "2026-05-28T07:30:00Z",
        "is_assessment": false,
        "activity": 0,
        "origin": "played",
        "duration": 3600,
        "rep_datas": [
          {
            "average_weight": 12.5,
            "is_rest": false,
            "hand": "right",
            "duration": 7000,
            "target_weight": 10.0,
            "index": 0,
            "grip_position": 0
          },
          {
            "average_weight": 0.0,
            "is_rest": true,
            "hand": "right",
            "duration": 3000,
            "target_weight": 0.0,
            "index": 1,
            "grip_position": 0
          }
        ],
        "assessments": []
      }
  auth:
    type: bearer
    token: "{{authTokenUser}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setEnvVar("sessionId", res.body.ID);
        }
