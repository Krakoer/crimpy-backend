name: crimpy

networks:
  proxy:
    external: true
  crimpy_net:
    name: crimpy_net

services:
  db:
    container_name: crimpy_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - crimpy_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 5
    restart: always

  migrate:
    container_name: crimpy_migrate
    image: arigaio/atlas:latest
    command: >
      migrate apply
      --url "${DATABASE_URL}"
      --dir "file://migrations"
    volumes:
      - ./migrations:/migrations
    networks:
      - crimpy_net
    depends_on:
      db:
        condition: service_healthy

  api:
    container_name: crimpy_api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-3000}
      ENV: production
    expose:
      - ${PORT:-3000}
    labels:
      - traefik.enable=true
      - traefik.http.routers.crimpy-api.rule=Host(`api.portfolio-online.ovh`)
      - traefik.http.routers.crimpy-api.entrypoints=websecure
      - traefik.http.routers.crimpy-api.tls.certresolver=dnsResolver
    networks:
      - proxy
      - crimpy_net
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always

volumes:
  pgdata: