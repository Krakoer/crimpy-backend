services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: crimpy
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  pgadmin:
    image: dpage/pgadmin4
    container_name: crimpy_pgadmin4
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    ports:
      - 8888:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://user:pass@db:5432/crimpy?sslmode=disable
      JWT_SECRET: devsecret
      ENV: development
    depends_on: [db]
    volumes:
      - .:/app
      - /app/tmp

volumes:
  pgdata:
  pgadmin-data: